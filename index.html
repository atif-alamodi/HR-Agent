اكتب التقرير بهذا الترتيب وبعناوين Markdown (## ) لكل قسم، بعمق وتفصيل لا باختصار:
## ملخص تنفيذي
4 إلى 6 أسطر: من المرشح، الحكم العام، أبرز قوة وأبرز خطر، والتوصية بجملة واحدة مع نسبة قوة الترشيح.
## الكفاءات الأساسية
التواصل، حل المشكلات، القيادة والعمل الجماعي، التكيّف. لكل كفاءة شاهد من السيرة ودرجة تقريبية ومواطن القوة والقصور.
## الكفاءات المشتركة (المتقاطعة بين الفني والإداري وبين الإدارات)
الكفاءات التي تربط الجانب الفني بالإداري أو تتقاطع مع إدارات أخرى حسب احتياج العمل، مع أمثلة من السيرة.
## الكفاءات الفنية التخصصية البحتة
العمق الفني التخصصي الخالص المرتبط بالدور: الأدوات والتقنيات والشهادات والمشاريع.
## نقاط القوة ونقاط الضعف والمخاطر
عدّد بوضوح: نقاط القوة، ثم نقاط الضعف ومجالات التطوير، ثم المخاطر ومؤشرات التحفظ.
## أسئلة المقابلة المقترحة
اكتب من 5 إلى 7 أسئلة دقيقة ومخصّصة لهذا المرشح وهذا الدور تحديدًا، لا أسئلة عامة مكرّرة. لكل سؤال التزم بهذا الشكل:
- **السؤال:** صياغة سلوكية ("حدّثني عن موقف...") أو موقفية ("كيف ستتعامل لو...") مبنية على شيء حقيقي ورد في السيرة أو على فجوة/خطر اكتشفته.
- **يقيس:** الكفاءة أو الفجوة المستهدفة (اذكرها صراحة).

/* ============================ Markdown ============================ */
function inline(text){
  const parts=[]; const regex=/(\*\*([^*]+)\*\*|`([^`]+)`)/g; let last=0,m,key=0;
  while((m=regex.exec(text))!==null){
    if(m.index>last) parts.push(text.slice(last,m.index));
    if(m[2]!==undefined) parts.push(<strong key={key++}>{m[2]}</strong>);
    else if(m[3]!==undefined) parts.push(<code key={key++} style={{background:"#EEF1EF",borderRadius:4,padding:"1px 5px",fontSize:".92em"}}>{m[3]}</code>);
    last=m.index+m[0].length;
  }
  if(last<text.length) parts.push(text.slice(last));
  return parts;
}
function renderRich(text){
  const lines=text.split("\n"); const out=[];
  lines.forEach((line,i)=>{
    if(line.trim()===""){ out.push(<div key={i} style={{height:7}}/>); return; }
    if(/^\s*\|.*\|\s*$/.test(line) && /\|/.test(line)){
      if(/^[\s|:-]+$/.test(line)) return;
      const cells=line.split("|").map(c=>c.trim()).filter((c,idx,a)=>!(idx===0&&c==="")&&!(idx===a.length-1&&c===""));
      out.push(<div key={i} style={{display:"flex",gap:1,background:T.border,borderRadius:6,overflow:"hidden",margin:"2px 0"}}>{cells.map((c,j)=><div key={j} style={{flex:1,background:"#fff",padding:"6px 9px",fontSize:13.5,lineHeight:1.6}}>{inline(c)}</div>)}</div>);
      return;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ out.push(<div key={i} style={{fontWeight:700,fontSize:15.5,margin:"9px 0 3px",color:T.ink}}>{inline(h[2])}</div>); return; }
    const b=line.match(/^\s*[-*]\s+(.*)$/);
    if(b){ out.push(<div key={i} style={{display:"flex",gap:8,margin:"3px 0"}}><span style={{color:T.muted,lineHeight:"1.85em"}}>•</span><span style={{flex:1,lineHeight:1.85}}>{inline(b[1])}</span></div>); return; }
    const n=line.match(/^\s*(\d+)\.\s+(.*)$/);
    if(n){ out.push(<div key={i} style={{display:"flex",gap:8,margin:"3px 0"}}><span style={{fontWeight:700,color:T.ink}}>{n[1]}.</span><span style={{flex:1,lineHeight:1.85}}>{inline(n[2])}</span></div>); return; }
    out.push(<div key={i} style={{margin:"3px 0",lineHeight:1.85}}>{inline(line)}</div>);
  });
  return out;
}

/* ============================ Charts & Reports ============================ */
function band(v){ v=Number(v)||0; return v>=75?"#1A6B52":v>=55?"#C98A2B":"#C0492F"; }
function dimsToArr(d){ return d&&typeof d==="object" ? Object.keys(d).map(k=>({axis:k,label:k,value:Math.max(0,Math.min(100,Number(d[k])||0))})) : []; }

function ScoreRing({value,size=72,label}){
  const v=Math.max(0,Math.min(100,Number(value)||0));
  const sw=Math.max(6,Math.round(size*0.11)), r=(size-sw)/2, c=2*Math.PI*r, off=c*(1-v/100), col=band(v), cc=size/2;
  return (<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,flexShrink:0}}>
    <svg width={size} height={size}>
      <circle cx={cc} cy={cc} r={r} fill="none" stroke="#E7ECE9" strokeWidth={sw}/>
      <circle cx={cc} cy={cc} r={r} fill="none" stroke={col} strokeWidth={sw} strokeLinecap="round" strokeDasharray={c} strokeDashoffset={off} transform={`rotate(-90 ${cc} ${cc})`}/>
      <text x={cc} y={cc} textAnchor="middle" dominantBaseline="central" style={{fontSize:size*0.3,fontWeight:800,fill:col,fontFamily:"'Tajawal',sans-serif"}}>{Math.round(v)}</text>
    </svg>
    {label&&<div style={{fontSize:12,fontWeight:700,color:col,textAlign:"center"}}>{label}</div>}
  </div>);
}
function RadarChart({data,accent="#0E7C86",size=216}){
  if(!data||data.length<3) return null;
  const cx=size/2, cy=size/2, R=size/2-40;
  const pt=(i,rr)=>{ const a=(-90+i*360/data.length)*Math.PI/180; return [cx+rr*Math.cos(a), cy+rr*Math.sin(a)]; };
  const ring=rr=>data.map((_,i)=>pt(i,R*rr).join(",")).join(" ");
  const dpoly=data.map((d,i)=>pt(i,R*d.value/100).join(",")).join(" ");
  return (<svg width={size} height={size} style={{flexShrink:0}}>
    {[0.25,0.5,0.75,1].map((r,k)=><polygon key={k} points={ring(r)} fill="none" stroke="#E4EAE7" strokeWidth="1"/>)}
    {data.map((_,i)=>{const[x,y]=pt(i,R);return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke="#E4EAE7" strokeWidth="1"/>;})}
    <polygon points={dpoly} fill={hexToRgba(accent,.20)} stroke={accent} strokeWidth="2"/>
    {data.map((d,i)=>{const[x,y]=pt(i,R*d.value/100);return <circle key={i} cx={x} cy={y} r="3" fill={accent}/>;})}
    {data.map((d,i)=>{const[x,y]=pt(i,R+19);return <text key={i} x={x} y={y} textAnchor="middle" dominantBaseline="central" style={{fontSize:10,fontWeight:600,fill:"#46544E"}}>{d.axis}</text>;})}
  </svg>);
}
function ScoreBars({data}){
  if(!data||!data.length) return null;
  return (<div style={{display:"flex",flexDirection:"column",gap:8,width:"100%"}}>
    {data.map((d,i)=>{const v=Math.max(0,Math.min(100,Number(d.value)||0)),col=band(v);return (
      <div key={i} style={{display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:108,fontSize:12,fontWeight:600,color:"#3A4742",textAlign:"right",flexShrink:0,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{d.label}</div>
        <div style={{flex:1,height:9,background:"#EDF1EF",borderRadius:6,overflow:"hidden"}}><div style={{width:v+"%",height:"100%",background:col,borderRadius:6}}/></div>
        <div style={{width:26,fontSize:12,fontWeight:800,color:col,flexShrink:0,textAlign:"left"}}>{Math.round(v)}</div>
      </div>);})}
  </div>);
}
function CompareBars({candidates}){
  const s=[...candidates].sort((a,b)=>(Number(b.overall)||0)-(Number(a.overall)||0));
  return (<div style={{display:"flex",flexDirection:"column",gap:10}}>
    {s.map((c,i)=>{const v=Math.max(0,Math.min(100,Number(c.overall)||0)),col=band(v);return(
      <div key={i} style={{display:"flex",alignItems:"center",gap:9}}>
        <div style={{width:22,height:22,borderRadius:"50%",background:hexToRgba(col,.15),color:col,fontWeight:800,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i+1}</div>
        <div style={{width:116,fontSize:13,fontWeight:700,color:"#1F2D28",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",flexShrink:0}}>{c.name||"مرشح"}</div>
        <div style={{flex:1,height:11,background:"#EDF1EF",borderRadius:6,overflow:"hidden"}}><div style={{width:v+"%",height:"100%",background:col,borderRadius:6}}/></div>
        <div style={{width:30,fontSize:13,fontWeight:800,color:col,flexShrink:0,textAlign:"left"}}>{Math.round(v)}</div>
      </div>);})}
  </div>);
}
function RecBadge({text,value}){const col=band(value);return <span style={{display:"inline-block",fontSize:12,fontWeight:800,color:col,background:hexToRgba(col,.12),border:`1px solid ${hexToRgba(col,.5)}`,borderRadius:999,padding:"3px 12px"}}>{text}</span>;}
function PillList({title,items,color}){

function ChartPair({dims,accent}){
  if(!dims||dims.length<3) return <ScoreBars data={dims}/>;

function CandidateBlock({c,accent}){
  const dims=dimsToArr(c.dimensions);
  return (<div style={{border:`1px solid ${T.border}`,borderRadius:14,padding:14,marginBottom:12,background:"#fff"}}>

        {c.recommendation&&<div style={{marginTop:6}}><RecBadge text={c.recommendation} value={c.overall}/></div>}
      </div>

    {dims.length>=3&&<ChartPair dims={dims} accent={accent}/>}

    <PillList title="نقاط الضعف ومجالات التطوير" items={c.weaknesses} color="#C98A2B"/>
    <PillList title="مخاطر ومؤشرات تحفّظ" items={c.risks} color="#C0492F"/>
    <PillList title="محاور التركيز في المقابلة" items={c.interviewFocus} color="#2D5B8E"/>
  </div>);

function recColor(rec,val){
  const r=(rec||"").toString();
  if(/توظيف مباشر|يوصى بالتقدم/.test(r)) return "#1A6B52";
  if(/غير مناسب/.test(r)) return "#C0492F";
  if(/تحفظ|واعد/.test(r)) return "#C98A2B";
  return band(val);
}
function recRank(r,type){
  const s=(r||"").toString();
  if(type==="interview"){ if(/يوصى بالتقدم/.test(s))return 3; if(/واعد/.test(s))return 2; if(/غير مناسب/.test(s))return 1; return 0; }
  if(/توظيف مباشر/.test(s))return 4; if(/بتحفظ/.test(s))return 2; if(/مقابلة/.test(s))return 3; if(/غير مناسب/.test(s))return 1; return 0;
}
function strictRecFromScore(v,type){
  v=Number(v)||0;
  if(type==="interview") return v>=85?"يوصى بالتقدم":v>=65?"واعد بتحفظ":"غير مناسب";

  const strict=strictRecFromScore(overall,type);
  const mr=recRank(modelRec,type), sr=recRank(strict,type);
  return (modelRec && mr>0 && mr<sr) ? modelRec : strict;
}

function parseHRData(text){
  if(!text) return null;
  const m=text.match(/<<<HRDATA>>>([\s\S]*?)<<<END>>>/i);
  if(!m) return null;
  const d={dims:[],ans:[],cands:[]};
  m[1].split(/\r?\n/).forEach(line=>{
    const t=line.trim(); if(!t) return;
    const eq=t.indexOf("="); if(eq<0) return;
    const k=t.slice(0,eq).trim().toLowerCase(); const v=t.slice(eq+1).trim();
    const clamp=x=>Math.max(0,Math.min(100,parseInt(x,10)||0));
    if(k==="dim"){ const p=v.split("|"); if(p[0]&&p[0].trim()) d.dims.push({axis:p[0].trim(),label:p[0].trim(),value:clamp(p[1])}); }
    else if(k==="ans"){ const p=v.split("|"); if(p[0]&&p[0].trim()) d.ans.push({label:p[0].trim(),value:clamp(p[1])}); }
    else if(k==="cand"){ const p=v.split("|"); if(p[0]&&p[0].trim()) d.cands.push({name:p[0].trim(),overall:clamp(p[1])}); }
    else if(k==="overall"||k==="strength") d[k]=clamp(v);
    else d[k]=v;
  });
  if(!d.type) d.type=(d.candidate||d.role||d.ans.length)?"interview":"cv";
  if(!d.recommendation && d.overall!=null){ d.recommendation = strictRecFromScore(d.overall, d.type); }
  return (d.dims.length||d.ans.length||d.overall!=null||d.recommendation)?d:null;
}
function stripBlocks(text){
  return text.replace(/<<<HRDATA>>>[\s\S]*?<<<END>>>/ig,"").replace(/```(?:hrjson|json)?[\s\S]*?```/gi,b=>/(HRDATA|"type"|candidates|dimensions)/.test(b)?"":b).trim();
}
function parseReport(text){
  if(!text) return {data:null,prose:""};
  return {data:parseHRData(text), prose:stripBlocks(text)};
}

const IMG=["png","jpg","jpeg","gif","webp"];
const toBase64=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
const toText=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(file);});
async function pdfToText(file){
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(it=>it.str).join(" ")+"\n";}
  return out.trim();
}
async function docxToText(file){
  const buf=await file.arrayBuffer();
  const r=await window.mammoth.extractRawText({arrayBuffer:buf});
  return (r.value||"").trim();
}
async function extractText(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="pdf") return await pdfToText(file);
  if(ext==="docx") return await docxToText(file);
  return await toText(file);
}
async function fileToBlock(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(IMG.includes(ext)){
    const data=await toBase64(file);
    const media_type=file.type||("image/"+(ext==="jpg"?"jpeg":ext));
    return {type:"image",source:{type:"base64",media_type,data}};
  }
  const text=await extractText(file);
  return {type:"text",text:`\n\n[ملف مرفق: ${file.name}]\n${text}`};
}

function getConfig(){
  return {
    worker:(localStorage.getItem("hra_worker")||"https://hr-agents-proxy.atif-alamodi.workers.dev").trim(),
    token:(localStorage.getItem("hra_token")||"").trim(),
    key:(localStorage.getItem("hra_key")||"").trim(),
    model:(localStorage.getItem("hra_model")||"claude-sonnet-4-6").trim(),
  };
}
function sanitize(messages){
  return messages.map(m=>{
    if(Array.isArray(m.content)){
      const c=m.content.filter(b=>!((b.type==="image"||b.type==="document")&&(!b.source||!b.source.data)));
      return {role:m.role,content:c.length?c:[{type:"text",text:"(مرفق غير متاح)"}]};
    }
    return {role:m.role,content:m.content};
  });
}
async function callAI(system,messages,modelOverride){
  const cfg=getConfig();
  const useModel=(cfg.worker&&modelOverride)?modelOverride:cfg.model;
  const payload={model:useModel,max_tokens:4096,system,messages:sanitize(messages)};
  let res;
  if(cfg.worker){
    const headers={"content-type":"application/json"};
    if(cfg.token) headers["x-app-token"]=cfg.token;
    res=await fetch(cfg.worker,{method:"POST",headers,body:JSON.stringify(payload)});
  } else if(cfg.key){
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(payload)});
  } else {
    throw new Error("NO_CONFIG");
  }
  if(!res.ok){ const t=await res.text().catch(()=> ""); throw new Error("HTTP "+res.status+(t?(": "+t.slice(0,180)):"")); }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  return text||"تعذّر توليد رد.";
}
function errMsg(e){
  if(e&&e.message==="NO_CONFIG") return "لم يتم إعداد الاتصال بالذكاء الاصطناعي. افتح الإعدادات وأضف رابط الخادم (Worker) أو مفتاح الـ API.";

}

  const showEmpty = !agent.intake && msgs.length===0 && !loading;

  return (<React.Fragment>
    <div className="app-root" dir="rtl" style={{height:"100vh",width:"100%",display:"flex",flexDirection:isMobile?"column":"row",background:T.bg,color:T.ink,overflow:"hidden"}}>
      {!configured&&(
        <div style={{position:"absolute",top:0,insetInline:0,zIndex:40,background:T.brass,color:"#1B1206",fontSize:13,textAlign:"center",padding:"7px 12px"}}>
          لم يُضبط الاتصال بعد. <button onClick={()=>setShowSettings(true)} style={{border:"none",background:"rgba(0,0,0,.12)",color:"#1B1206",borderRadius:7,padding:"2px 10px",fontWeight:700,marginInlineStart:6}}>افتح الإعدادات</button>
        </div>
      )}

      {isMobile?(
        <div style={{background:T.sidebar}}>{brand}{chips}</div>
      ):(
        <aside style={{width:308,flexShrink:0,background:T.sidebar,display:"flex",flexDirection:"column",borderInlineStart:`4px solid ${T.brass}`}}>
          {brand}
          <div style={{height:1,background:"rgba(255,255,255,.07)",margin:"0 16px 10px"}}/>
          <div className="hra-scroll" style={{flex:1,overflowY:"auto",padding:"0 12px"}}>{agentList}</div>
          <div style={{padding:"12px 18px",fontSize:11,color:T.sideMuted,borderTop:"1px solid rgba(255,255,255,.07)",lineHeight:1.7}}>مدعوم بالذكاء الاصطناعي · كل وكيل محمّل بنظام العمل السعودي</div>
        </aside>
      )}

      <main style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,minHeight:0}}>
        {header(!isMobile)}
        <div className="hra-scroll" style={{flex:1,overflowY:"auto",padding:isMobile?"16px 12px":"22px 18px",display:"flex",flexDirection:"column"}}>
          {showIntake?<div style={{margin:"auto",width:"100%"}}>{intakeView}</div>:showEmpty?<div style={{margin:"auto",width:"100%"}}>{empty}</div>:thread}
        </div>
        {(!showIntake)&&composer}
        {showIntake&&error&&<div style={{padding:"0 16px 12px"}}><div style={{maxWidth:760,margin:"0 auto",background:"#FCEDED",color:"#9B2C2C",border:"1px solid #F3C9C9",borderRadius:10,padding:"8px 12px",fontSize:13}}>{error}</div></div>}
      </main>

      {showSettings&&<Settings onClose={()=>{ setShowSettings(false); setError(null); setCfgVersion(v=>v+1); }}/>}
    </div>
    {printMsg&&(
      <div id="print-area" dir="rtl" style={{background:"#fff"}}>
        <PrintReport msg={printMsg} agent={agent}/>
      </div>
    )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  /* تسجيل عامل الخدمة لجعل التطبيق قابلًا للتثبيت ويعمل بأيقونة مستقلة */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
<script>
  /* لافتة تثبيت داخل التطبيق: زر صريح على أندرويد، وتلميح على آيفون */
  (function () {
    function isStandalone() {
      return (
        window.matchMedia("(display-mode: standalone)").matches ||
        window.navigator.standalone === true
      );
    }
    if (isStandalone()) return;
    var dp = null;
    function banner(innerHTML) {
      var b = document.createElement("div");
      b.id = "hra-install";
      b.dir = "rtl";
      b.style.cssText =
        "position:fixed;left:12px;right:12px;bottom:12px;z-index:99999;background:#16261F;color:#E9EDEA;border:1px solid #2c4a3e;border-radius:14px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.32);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:14px";
      b.innerHTML = innerHTML;
      document.body.appendChild(b);
      return b;
    }
    function closeBtn(b) {
      var c = document.createElement("button");
      c.textContent = "\u2715";
      c.style.cssText =
        "background:transparent;color:#90A39A;border:none;font-size:16px;padding:4px 8px;cursor:pointer";
      c.onclick = function () { b.remove(); };
      return c;
    }
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      dp = e;
      if (document.getElementById("hra-install")) return;
      var b = banner('<span style="flex:1">ثبّت تطبيق وكلاء الموارد البشرية على جهازك</span>');
      var btn = document.createElement("button");
      btn.textContent = "تثبيت";
      btn.style.cssText =
        "background:#B7894A;color:#1B2A26;border:none;border-radius:10px;padding:9px 18px;font-weight:700;font-size:14px;cursor:pointer";
      btn.onclick = function () {
        if (!dp) return;
        dp.prompt();
        dp.userChoice.finally(function () { dp = null; b.remove(); });
      };
      b.appendChild(btn);
      b.appendChild(closeBtn(b));
    });
    window.addEventListener("appinstalled", function () {
      var el = document.getElementById("hra-install");
      if (el) el.remove();
    });
    var ua = navigator.userAgent || "";
    var isIOS = /iphone|ipad|ipod/i.test(ua);
    if (isIOS) {
      setTimeout(function () {
        if (document.getElementById("hra-install")) return;
        var b = banner('<span style="flex:1;line-height:1.7">للتثبيت على آيفون: افتح في Safari، اضغط زر المشاركة، ثم \u201cإضافة إلى الشاشة الرئيسية\u201d</span>');
        b.appendChild(closeBtn(b));
      }, 1500);
    }
  })();
</script>
</body>
</html>
