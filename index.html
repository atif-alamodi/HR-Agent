/* ============================ Markdown ============================ */
function inline(text){
  const parts=[]; const regex=/(\*\*([^*]+)\*\*|`([^`]+)`)/g; let last=0,m,key=0;
  while((m=regex.exec(text))!==null){
    if(m.index>last) parts.push(text.slice(last,m.index));
    if(m[2]!==undefined) parts.push(<strong key={key++}>{m[2]}</strong>);
    else if(m[3]!==undefined) parts.push(<code key={key++} style={{background:"#EEF1EF",borderRadius:4,padding:"1px 5px",fontSize:".92em"}}>{m[3]}</code>);
    last=m.index+m[0].length;
  }
  if(last<text.length) parts.push(text.slice(last));
  return parts;
}
function renderRich(text){
  const lines=text.split("\n"); const out=[];
  lines.forEach((line,i)=>{
    if(line.trim()===""){ out.push(<div key={i} style={{height:7}}/>); return; }
    if(/^\s*\|.*\|\s*$/.test(line) && /\|/.test(line)){
      if(/^[\s|:-]+$/.test(line)) return;
      const cells=line.split("|").map(c=>c.trim()).filter((c,idx,a)=>!(idx===0&&c==="")&&!(idx===a.length-1&&c===""));
      out.push(<div key={i} style={{display:"flex",gap:1,background:T.border,borderRadius:6,overflow:"hidden",margin:"2px 0"}}>{cells.map((c,j)=><div key={j} style={{flex:1,background:"#fff",padding:"6px 9px",fontSize:13.5,lineHeight:1.6}}>{inline(c)}</div>)}</div>);
      return;
    }
    const h=line.match(/^(#{1,4})\s+(.*)$/);
    if(h){ out.push(<div key={i} style={{fontWeight:700,fontSize:15.5,margin:"9px 0 3px",color:T.ink}}>{inline(h[2])}</div>); return; }
    const b=line.match(/^\s*[-*]\s+(.*)$/);
    if(b){ out.push(<div key={i} style={{display:"flex",gap:8,margin:"3px 0"}}><span style={{color:T.muted,lineHeight:"1.85em"}}>•</span><span style={{flex:1,lineHeight:1.85}}>{inline(b[1])}</span></div>); return; }
    const n=line.match(/^\s*(\d+)\.\s+(.*)$/);
    if(n){ out.push(<div key={i} style={{display:"flex",gap:8,margin:"3px 0"}}><span style={{fontWeight:700,color:T.ink}}>{n[1]}.</span><span style={{flex:1,lineHeight:1.85}}>{inline(n[2])}</span></div>); return; }
    out.push(<div key={i} style={{margin:"3px 0",lineHeight:1.85}}>{inline(line)}</div>);
  });
  return out;
}

/* ============================ Files & API ============================ */
const IMG=["png","jpg","jpeg","gif","webp"];
const toBase64=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file);});
const toText=file=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result));r.onerror=rej;r.readAsText(file);});
async function pdfToText(file){
  const buf=await file.arrayBuffer();
  const pdf=await window.pdfjsLib.getDocument({data:buf}).promise;
  let out="";
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out+=tc.items.map(it=>it.str).join(" ")+"\n";}
  return out.trim();
}
async function docxToText(file){
  const buf=await file.arrayBuffer();
  const r=await window.mammoth.extractRawText({arrayBuffer:buf});
  return (r.value||"").trim();
}
async function extractText(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(ext==="pdf") return await pdfToText(file);
  if(ext==="docx") return await docxToText(file);
  return await toText(file);
}
async function fileToBlock(file){
  const ext=(file.name.split(".").pop()||"").toLowerCase();
  if(IMG.includes(ext)){
    const data=await toBase64(file);
    const media_type=file.type||("image/"+(ext==="jpg"?"jpeg":ext));
    return {type:"image",source:{type:"base64",media_type,data}};
  }
  const text=await extractText(file);
  return {type:"text",text:`\n\n[ملف مرفق: ${file.name}]\n${text}`};
}

function getConfig(){
  return {
    worker:(localStorage.getItem("hra_worker")||"https://hr-agents-proxy.atif-alamodi.workers.dev").trim(),
    token:(localStorage.getItem("hra_token")||"").trim(),
    key:(localStorage.getItem("hra_key")||"").trim(),
    model:(localStorage.getItem("hra_model")||"claude-sonnet-4-6").trim(),
  };
}
function sanitize(messages){
  return messages.map(m=>{
    if(Array.isArray(m.content)){
      const c=m.content.filter(b=>!((b.type==="image"||b.type==="document")&&(!b.source||!b.source.data)));
      return {role:m.role,content:c.length?c:[{type:"text",text:"(مرفق غير متاح)"}]};
    }
    return {role:m.role,content:m.content};
  });
}
async function callAI(system,messages){
  const cfg=getConfig();
  const payload={model:cfg.model,max_tokens:4096,system,messages:sanitize(messages)};
  let res;
  if(cfg.worker){
    const headers={"content-type":"application/json"};
    if(cfg.token) headers["x-app-token"]=cfg.token;
    res=await fetch(cfg.worker,{method:"POST",headers,body:JSON.stringify(payload)});
  } else if(cfg.key){
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":cfg.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify(payload)});
  } else {
    throw new Error("NO_CONFIG");
  }
  if(!res.ok){ const t=await res.text().catch(()=> ""); throw new Error("HTTP "+res.status+(t?(": "+t.slice(0,180)):"")); }
  const data=await res.json();
  const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
  return text||"تعذّر توليد رد.";
}
function errMsg(e){
  if(e&&e.message==="NO_CONFIG") return "لم يتم إعداد الاتصال بالذكاء الاصطناعي. افتح الإعدادات وأضف رابط الخادم (Worker) أو مفتاح الـ API.";
  return "تعذّر الوصول إلى الوكيل: "+(e&&e.message?e.message:"خطأ غير معروف");
}

      <div onClick={()=>cvRef.current&&cvRef.current.click()} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={e=>{e.preventDefault();setDragOver(false);addCvs(e.dataTransfer.files);}}
        style={{marginTop:14,border:`1.5px dashed ${dragOver?agent.accent:T.border}`,background:dragOver?hexToRgba(agent.accent,.06):"#FBFCFB",borderRadius:14,padding:"24px 16px",textAlign:"center",cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"center",marginBottom:8}}><IconUpload size={26} color={agent.accent}/></div>
        <div style={{fontSize:14,color:T.ink,fontWeight:600}}>اسحب وأفلت السير الذاتية هنا أو اضغط للاختيار</div>
        <div style={{fontSize:12,color:T.muted,marginTop:4}}>يدعم PDF و DOCX و TXT · يمكن إضافة عدة ملفات</div>
        <input ref={cvRef} type="file" multiple accept=".pdf,.docx,.txt,.md" style={{display:"none"}} onChange={e=>{addCvs(e.target.files);e.target.value="";}}/>
      </div>
      {cvFiles.length>0&&(
        <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:7}}>
          {cvFiles.map(c=>(
            <div key={c.id} style={{display:"flex",alignItems:"center",gap:10,border:`1px solid ${T.border}`,borderRadius:10,padding:"9px 11px",background:"#fff"}}>
              <IconDoc size={17} color={agent.accent}/>
              <span style={{flex:1,minWidth:0,fontSize:13.5,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{c.name}</span>
              {c.status==="reading"&&<span className="hra-spin" style={{display:"inline-flex"}}><IconSpinner size={15} color={T.muted}/></span>}
              {c.status==="done"&&<IconCheck size={16} color="#1A6B52"/>}
              {c.status==="error"&&<span style={{fontSize:11.5,color:"#9B2C2C"}}>تعذّرت القراءة</span>}
              <button onClick={()=>setCvFiles(p=>p.filter(x=>x.id!==c.id))} aria-label="حذف" style={{border:"none",background:"transparent",color:T.muted,padding:2}}><IconX size={16}/></button>
            </div>
          ))}
        </div>
      )}
      <button onClick={runScreen} disabled={loading||cvReady===0} style={{marginTop:16,width:"100%",border:"none",borderRadius:12,padding:"13px",fontSize:15,fontWeight:700,color:"#fff",background:(loading||cvReady===0)?"#C3CCC7":agent.accent}}>
        {loading?"جارٍ التحليل...":(cvReady>1?`حلّل وفاضل ${cvReady} مرشحين`:cvReady===1?"حلّل المرشح":"أضف سيرة واحدة على الأقل")}
      </button>
    </div>
  );

  const composer=(
    <div style={{borderTop:`1px solid ${T.border}`,background:T.surface,padding:isMobile?"10px 12px":"12px 18px"}}>
      {error&&<div style={{maxWidth:840,margin:"0 auto 9px",background:"#FCEDED",color:"#9B2C2C",border:"1px solid #F3C9C9",borderRadius:10,padding:"8px 12px",fontSize:13}}>{error}</div>}
      {pending.length>0&&(
        <div style={{maxWidth:840,margin:"0 auto 8px",display:"flex",flexWrap:"wrap",gap:7}}>
          {pending.map((f,i)=>(
            <span key={i} style={{display:"inline-flex",alignItems:"center",gap:6,fontSize:12,background:"#EEF2F0",color:T.muted,borderRadius:8,padding:"5px 9px",maxWidth:220}}>
              <IconDoc size={13} color={agent.accent}/>
              <span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{f.name}</span>
              <button onClick={()=>setPending(p=>p.filter((_,j)=>j!==i))} aria-label="إزالة" style={{border:"none",background:"transparent",color:T.muted,padding:0,display:"inline-flex"}}><IconX size={13}/></button>
            </span>
          ))}
        </div>
      )}
      <div style={{maxWidth:840,margin:"0 auto",display:"flex",alignItems:"flex-end",gap:9}}>
        <button onClick={()=>fileRef.current&&fileRef.current.click()} aria-label="إرفاق ملف" title="إرفاق ملف" style={{height:46,width:46,flexShrink:0,borderRadius:14,border:`1px solid ${T.border}`,background:"#fff",color:T.muted,display:"flex",alignItems:"center",justifyContent:"center"}}><IconUpload size={19}/></button>
        <input ref={fileRef} type="file" multiple accept="image/*,.pdf,.docx,.txt,.md,.csv" style={{display:"none"}} onChange={e=>{setPending(p=>[...p,...Array.from(e.target.files||[])]);e.target.value="";}}/>
        <textarea ref={taRef} value={input} onChange={onInput} onKeyDown={onKeyDown} rows={1} placeholder={`اكتب رسالتك إلى ${agent.name}...`} aria-label="مربع الرسالة"
          style={{flex:1,resize:"none",height:46,maxHeight:150,border:`1px solid ${T.border}`,borderRadius:14,padding:"12px 14px",fontSize:14.5,lineHeight:1.7,color:T.ink,background:"#FBFCFB",outline:"none"}}/>
        <button onClick={()=>handleSend()} disabled={loading||(!input.trim()&&pending.length===0)} aria-label="إرسال"
          style={{height:46,width:46,flexShrink:0,borderRadius:14,border:"none",background:(loading||(!input.trim()&&pending.length===0))?"#C3CCC7":agent.accent,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center"}}>
          {loading?<span className="hra-spin" style={{display:"inline-flex"}}><IconSpinner size={19} color="#fff"/></span>:<IconSend size={19}/>}
        </button>
      </div>
    </div>
  );

  const header=(big)=> (
    <div style={{display:"flex",alignItems:"center",gap:big?12:9,padding:big?"13px 18px":"10px 14px",background:T.surface,borderBottom:`1px solid ${T.border}`}}>
      <Seal Icon={agent.icon} accent={agent.accent} size={big?40:32}/>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:700,fontSize:big?15.5:14,color:T.ink,fontFamily:"'Tajawal',sans-serif"}}>{agent.name}</div>
        {big&&<div style={{fontSize:12,color:T.muted,marginTop:1}}>{agent.role}</div>}
      </div>
      <button onClick={newChat} style={{display:"flex",alignItems:"center",gap:6,border:`1px solid ${T.border}`,background:"#fff",color:T.muted,borderRadius:10,padding:big?"7px 12px":"6px 9px",fontSize:12.5,fontWeight:600}}>
        <IconPlus size={15}/> {agent.intake?"مفاضلة جديدة":"محادثة جديدة"}
      </button>
    </div>
  );

  const showIntake = agent.intake && msgs.length===0 && !loading;
  const showEmpty = !agent.intake && msgs.length===0 && !loading;

  return (
    <div dir="rtl" style={{height:"100vh",width:"100%",display:"flex",flexDirection:isMobile?"column":"row",background:T.bg,color:T.ink,overflow:"hidden"}}>
      {!configured&&(
        <div style={{position:"absolute",top:0,insetInline:0,zIndex:40,background:T.brass,color:"#1B1206",fontSize:13,textAlign:"center",padding:"7px 12px"}}>
          لم يُضبط الاتصال بعد. <button onClick={()=>setShowSettings(true)} style={{border:"none",background:"rgba(0,0,0,.12)",color:"#1B1206",borderRadius:7,padding:"2px 10px",fontWeight:700,marginInlineStart:6}}>افتح الإعدادات</button>
        </div>
      )}

      {isMobile?(
        <div style={{background:T.sidebar}}>{brand}{chips}</div>
      ):(
        <aside style={{width:308,flexShrink:0,background:T.sidebar,display:"flex",flexDirection:"column",borderInlineStart:`4px solid ${T.brass}`}}>
          {brand}
          <div style={{height:1,background:"rgba(255,255,255,.07)",margin:"0 16px 10px"}}/>
          <div className="hra-scroll" style={{flex:1,overflowY:"auto",padding:"0 12px"}}>{agentList}</div>
          <div style={{padding:"12px 18px",fontSize:11,color:T.sideMuted,borderTop:"1px solid rgba(255,255,255,.07)",lineHeight:1.7}}>مدعوم بالذكاء الاصطناعي · كل وكيل محمّل بنظام العمل السعودي</div>
        </aside>
      )}

      <main style={{flex:1,display:"flex",flexDirection:"column",minWidth:0,minHeight:0}}>
        {header(!isMobile)}
        <div className="hra-scroll" style={{flex:1,overflowY:"auto",padding:isMobile?"16px 12px":"22px 18px",display:"flex",flexDirection:"column"}}>
          {showIntake?<div style={{margin:"auto",width:"100%"}}>{intake}</div>:showEmpty?<div style={{margin:"auto",width:"100%"}}>{empty}</div>:thread}
        </div>
        {(!showIntake)&&composer}
        {showIntake&&error&&<div style={{padding:"0 16px 12px"}}><div style={{maxWidth:760,margin:"0 auto",background:"#FCEDED",color:"#9B2C2C",border:"1px solid #F3C9C9",borderRadius:10,padding:"8px 12px",fontSize:13}}>{error}</div></div>}
      </main>

      {showSettings&&<Settings onClose={()=>{ setShowSettings(false); setError(null); setCfgVersion(v=>v+1); }}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
  /* تسجيل عامل الخدمة لجعل التطبيق قابلًا للتثبيت ويعمل بأيقونة مستقلة */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
</html>
